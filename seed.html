<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earth Seed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{
  --bg:#141414;
  --fg:#e0e0e0;
  --shadow:#3f3f3f;
  --plate:rgba(80,80,80,.55);
  --warn:#ff5555;
  --font:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:clamp(22px,5.2vw,34px);line-height:1;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;box-sizing:border-box;-webkit-font-smoothing:none}
#hud{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.l{background:var(--plate);padding:2px 4px 3px;text-shadow:.12em .12em 0 var(--shadow);white-space:pre;font-variant-numeric:tabular-nums;max-width:100%;overflow-x:auto}
.gap{height:.6em}
.warn{color:var(--warn)}
</style>
</head>
<body>
<div id="hud"><div class="l">Waiting for position...</div></div>
<script>
(()=>{
  const hud=document.getElementById('hud');
  const EQ=40075016.686/360;      // 経度1度あたりのm(赤道)
  const MER=20003930.7/180;       // 緯度1度あたりのm(子午線)
  const LIMIT=100000;             // 高度100km = Z=0

  const f3=n=>n.toFixed(3);
  const blk=n=>Math.floor(n);

  // ブロック座標から64bit符号付きシードを作る
  const M=(1n<<64n)-1n;
  function mix(z){
    z=(z+0x9E3779B97F4A7C15n)&M;
    z=((z^(z>>30n))*0xBF58476D1CE4E5B9n)&M;
    z=((z^(z>>27n))*0x94D049BB133111EBn)&M;
    return z^(z>>31n);
  }
  function seed(bx,by,bz){
    let h=0n;
    for(const v of [bx,by,bz])h=mix(h^(BigInt(v)&M));
    return BigInt.asIntN(64,h).toString();
  }

  function render(lines){
    hud.replaceChildren(...lines.map(t=>{
      const d=document.createElement('div');
      if(t===null){d.className='gap';return d;}
      d.className='l'+(t.warn?' warn':'');
      d.textContent=t.warn?t.text:t;
      return d;
    }));
  }

  function update(p){
    const {latitude:lat,longitude:lon,altitude:alt}=p.coords;
    const x=lon*EQ, y=lat*MER;
    const noAlt=alt==null;
    const z=LIMIT-(noAlt?0:alt);
    const bx=blk(x),by=blk(y),bz=blk(z);
    const out=[
      'Earth (vanilla)',
      null,
      `XYZ: ${f3(x)} / ${f3(y)} / ${f3(z)}`,
      `Block: ${bx} ${by} ${bz}`,
      `Chunk: ${bx&15} ${by&15} ${bz&15} in ${bx>>4} ${by>>4} ${bz>>4}`,
      null,
      `Seed: [${seed(bx,by,bz)}]`
    ];
    if(noAlt)out.push(null,{warn:1,text:'Altitude unknown: Z assumes sea level'});
    render(out);
  }

  function fail(e){
    const msg={1:'Location access denied',2:'Position unavailable',3:'Timed out'}[e.code]||'Location error';
    render([{warn:1,text:msg}]);
  }

  if(!('geolocation' in navigator)){render([{warn:1,text:'Geolocation not supported'}]);return;}
  navigator.geolocation.watchPosition(update,fail,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
})();
</script>
</body>
</html>
