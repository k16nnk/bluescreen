<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ブルースクリーン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap">
<style>
/* 全面ブルー単色。白文字だけ。CRT/VHSの劣化を上から重ねる */
:root{
  --blue:#0a14b4;
  --blue-deep:#040a6e;
  --white:#f2f4ff;
  --ghost-r:rgba(255,40,60,.55);
  --ghost-c:rgba(40,230,255,.45);
  --font:"VT323","DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--blue);cursor:none}
body{background:radial-gradient(ellipse at 50% 50%,var(--blue) 55%,var(--blue-deep) 100%)}
#screen{position:fixed;inset:0;animation:breathe 7s ease-in-out infinite}
#t{
  position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;
  padding:max(6vh,24px) max(6vw,20px);
  background:transparent;border:0;outline:0;resize:none;
  color:var(--white);caret-color:transparent;
  font-family:var(--font);font-size:clamp(22px,3.4vw,44px);line-height:1.35;letter-spacing:.04em;
  text-shadow:-1.5px 0 var(--ghost-r),1.5px 0 var(--ghost-c),0 0 8px rgba(255,255,255,.35);
  overflow:hidden;white-space:pre-wrap;word-break:break-all;
}
#t::selection{background:var(--white);color:var(--blue)}
#t.tear{animation:tear .18s steps(3) 1}
#t.skew{transform:skewX(-6deg) translateX(8px);filter:blur(.6px)}
.fx{position:fixed;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.roll{background:linear-gradient(to bottom,transparent 0,rgba(255,255,255,.06) 45%,rgba(255,255,255,.1) 50%,transparent 60%);height:22vh;inset:auto 0 auto 0;animation:roll 9s linear infinite}
.vig{background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,20,.75) 100%)}
#noise{width:100%;height:100%;opacity:.09;mix-blend-mode:screen;image-rendering:pixelated}
.flick{background:#fff;opacity:0}
.flick.on{animation:flash .12s 1}
@keyframes roll{from{transform:translateY(-25vh)}to{transform:translateY(110vh)}}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(.93)}}
@keyframes tear{0%{transform:translateX(-10px)}50%{transform:translateX(14px) skewX(3deg)}100%{transform:none}}
@keyframes flash{0%{opacity:.12}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #screen,.roll{animation:none}.roll{display:none}
  #t.tear,#t.skew{animation:none;transform:none;filter:none}
  .flick.on{animation:none}
}
</style>
</head>
<body>

<div id="screen">
  <textarea id="t" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="画面に表示する文字"></textarea>
</div>
<canvas id="noise" class="fx"></canvas>
<div class="fx scan"></div>
<div class="fx roll"></div>
<div class="fx vig"></div>
<div class="fx flick" id="flick"></div>

<script>
(()=>{
  const t=document.getElementById('t');
  const KEY='bluescreen-text';
  try{const s=localStorage.getItem(KEY);if(s!==null)t.value=s;}catch(e){}
  t.addEventListener('input',()=>{try{localStorage.setItem(KEY,t.value)}catch(e){}});
  const focus=()=>{t.focus({preventScroll:true})};
  focus();document.addEventListener('pointerdown',()=>setTimeout(focus,0));

  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 粗いノイズ
  const c=document.getElementById('noise'),x=c.getContext('2d');
  const W=160,H=100;c.width=W;c.height=H;
  const img=x.createImageData(W,H);
  function noise(){
    const d=img.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
    x.putImageData(img,0,0);
  }
  noise();
  if(reduce)return;
  let last=0;
  (function loop(ts){if(ts-last>60){noise();last=ts;}requestAnimationFrame(loop)})(0);

  // 不定期な映像の乱れ
  const flick=document.getElementById('flick');
  function glitch(){
    const r=Math.random();
    if(r<.55){t.classList.remove('tear');void t.offsetWidth;t.classList.add('tear');}
    else if(r<.85){t.classList.add('skew');setTimeout(()=>t.classList.remove('skew'),70+Math.random()*90);}
    else{flick.classList.remove('on');void flick.offsetWidth;flick.classList.add('on');}
    setTimeout(glitch,1800+Math.random()*6500);
  }
  setTimeout(glitch,2500);

  // ごくたまに一瞬だけ文字が消える
  (function blackout(){
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.opacity='';blackout();},90+Math.random()*120);},9000+Math.random()*16000);
  })();
})();
</script>
</body>
</html>
